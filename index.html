const GREETING_DURATION_MS=12000;
const RETURN_GREETING_MS=5500;

const $=id=>document.getElementById(id);
let simulation=null,lastDate=null,lastPeriod=null,greetingTimer=null,transitionTimer=null,thoughtStyle=0;

function bClock(){if(simulation)return {...simulation};const parts=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const x={};parts.forEach(p=>{if(p.type!=='literal')x[p.type]=p.value});return {date:`${x.year}-${x.month}-${x.day}`,hour:Number(x.hour),minute:Number(x.minute)};}
function dayDifference(a,b){const p=a.split('-').map(Number),q=b.split('-').map(Number);return Math.round((Date.UTC(q[0],q[1]-1,q[2])-Date.UTC(p[0],p[1]-1,p[2]))/864e5)}
function period(hour){return hour>=18?'night':hour>=12?'afternoon':'morning'}
function randomOrder(n,year){let seed=(Math.imul(year,2654435761))>>>0;const order=[];for(let start=0;start<n;start+=15){const a=Array.from({length:Math.min(15,n-start)},(_,i)=>start+i);for(let i=a.length-1;i>0;i--){seed=(Math.imul(1664525,seed)+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]]}order.push(...a)}return order}
const yearOrders=new Map();function quoteFor(date){const year=Number(date.slice(0,4)),start=`${year}-01-01`,index=dayDifference(start,date);if(!yearOrders.has(year))yearOrders.set(year,randomOrder(THOUGHTS.length,year));return THOUGHTS[yearOrders.get(year)[((index%THOUGHTS.length)+THOUGHTS.length)%THOUGHTS.length]]}

function welcome(p,duration=GREETING_DURATION_MS){

}
function onSlideReturn(){

}
function animateNumber(){const s=$('screen');s.classList.remove('is-updating');void s.offsetWidth;s.classList.add('is-updating');setTimeout(()=>s.classList.remove('is-updating'),1400)}
function render(force=false){const now=bClock(),p=period(now.hour),days=dayDifference(now.date,TARGET);if(force||lastDate!==now.date){$('count').textContent=String(Math.max(0,days));$('prefix').textContent=days>0?'Faltam':days===0?'É hoje!':'Seguimos';$('unit').textContent=days===1?'dia':days<0?'juntos':'dias';$('tagline').textContent=days<0?'Obrigado por fazer parte dessa jornada!':days===0?'Chegamos juntos até aqui!':'para mostrar a força do nosso time!';$('thought').textContent=quoteFor(now.date);const d=new Date(now.date+'T12:00:00');$('date-text').textContent=' · '+new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long',timeZone:TZ}).format(d);$('footer-right').textContent=days>=0?'Contagem até 31 de dezembro':'O futuro começa agora';animateNumber();lastDate=now.date}
if(force||lastPeriod!==p){$('screen').dataset.theme=p;$('moment').textContent={morning:'Comece com propósito.',afternoon:'Siga fazendo a diferença.',night:'Valorize o caminho percorrido.'}[p];if(lastPeriod===null||lastPeriod!==p)welcome(p);lastPeriod=p}}
// Same daily thought; every 30s a very subtle typographic reveal, without replacing the content.
function subtleThought(){const node=$('thought');node.classList.add('slow-transition');clearTimeout(transitionTimer);transitionTimer=setTimeout(()=>{node.classList.remove('slow-transition');thoughtStyle=(thoughtStyle+1)%2;node.style.fontWeight=thoughtStyle?'720':'750'},620)}
function start(){const img=$('logo');img.addEventListener('error',()=>{img.classList.add('fallback');document.querySelector('.brandfallback').hidden=false});render();setInterval(()=>render(),10000);setInterval(()=>{if(!$('overlay').classList.contains('active'))subtleThought()},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)hasHidden=true;else if(hasHidden){hasHidden=false;onSlideReturn()}});
window.addEventListener('focus',()=>{if(hasHidden){hasHidden=false;onSlideReturn()}});
if(new URLSearchParams(location.search).get('teste')==='1'){$('test').classList.add('on');$('apply').onclick=()=>{const date=$('testDate').value,time=$('testTime').value;if(!date||!time)return;const [h,m]=time.split(':').map(Number);simulation={date,hour:h,minute:m};render(true)};$('showGreeting').onclick=()=>welcome(period(bClock().hour));$('showReturn').onclick=()=>welcome(period(bClock().hour),RETURN_GREETING_MS);$('simulateMidnight').onclick=()=>{const t=bClock(),d=new Date(t.date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+1);simulation={date:d.toISOString().slice(0,10),hour:t.hour,minute:t.minute};$('testDate').value=simulation.date;render(true)};$('reset').onclick=()=>{simulation=null;lastDate=null;lastPeriod=null;render(true)}}}
start();
</script></body></html>
